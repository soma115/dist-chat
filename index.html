<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3b82f6">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' fill='%233b82f6'/%3E%3Ctext x='96' y='120' font-size='80' text-anchor='middle' fill='white'%3ED%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <title>Distributed Chat</title>
</head>
<body>
  <div id="setup">
    <header>
      <h1>Distributed Chat</h1>
      <p class="meta">Węzeł P2P w twojej kieszeni</p>
    </header>
    <main>
      <div class="card">
        <h2>Ustaw swoją tożsamość</h2>
        <input id="name-input" type="text" placeholder="Twoje imię / nick" maxlength="24">
        <button id="start-btn" class="btn" type="button">Dołącz do sieci</button>
      </div>
    </main>
  </div>

  <div id="app" class="hidden">
    <header>
      <h1>Distributed Chat</h1>
      <p class="meta" id="my-meta"></p>
    </header>
    <main id="main-content">
      <section id="view-peers" class="view">
        <div class="card">
          <h3>Twój UUID</h3>
          <p class="uuid" id="my-uuid"></p>
          <button id="copy-uuid-btn" class="btn secondary" type="button">Kopiuj UUID</button>
        </div>

        <div class="card">
          <h3>Nowe połączenie</h3>
          <button id="create-offer-btn" class="btn" type="button">Stwórz zaproszenie</button>
          <button id="accept-offer-btn" class="btn secondary" type="button">Akceptuj zaproszenie</button>
          <div id="sdp-area" class="hidden">
            <label for="sdp-out">Wyślij ten kod do drugiej osoby:</label>
            <textarea id="sdp-out" rows="4" readonly></textarea>
            <label for="sdp-in">Wklej kod od drugiej osoby:</label>
            <textarea id="sdp-in" rows="4" placeholder="wklej SDP"></textarea>
            <button id="sdp-next-btn" class="btn success" type="button">Dalej</button>
          </div>
        </div>

        <div class="card">
          <h3>Dodaj znajomego po UUID</h3>
          <input id="friend-uuid" type="text" placeholder="UUID znajomego">
          <button id="add-friend-uuid-btn" class="btn" type="button">Wyślij prośbę</button>
        </div>

        <div class="card">
          <h3>Twoje połączenia</h3>
          <ul id="peers-list" class="list"></ul>
        </div>
      </section>

      <section id="view-groups" class="view hidden">
        <div class="card">
          <h3>Twoja grupa</h3>
          <p class="empty" id="groups-empty">Nie masz jeszcze znajomych.</p>
          <ul id="groups-list" class="list"></ul>
        </div>
      </section>

      <section id="view-chat" class="view hidden">
        <div class="card">
          <h3>Czat</h3>
          <div id="chat-messages" class="chat-box"></div>
          <input id="chat-input" type="text" placeholder="Napisz wiadomość...">
          <button id="chat-send-btn" class="btn" type="button">Wyślij</button>
        </div>
      </section>

      <section id="view-polls" class="view hidden">
        <div class="card">
          <h3>Nowe głosowanie</h3>
          <input id="poll-question" type="text" placeholder="Pytanie">
          <textarea id="poll-options" rows="2" placeholder="Opcje oddzielone przecinkami"></textarea>
          <button id="poll-create-btn" class="btn" type="button">Utwórz</button>
        </div>
        <div class="card">
          <h3>Aktywne głosowania</h3>
          <div id="polls-list" class="polls-list"></div>
        </div>
      </section>
    </main>

    <nav class="tabs">
      <button data-view="view-peers" class="active">Węzły</button>
      <button data-view="view-groups">Grupa</button>
      <button data-view="view-chat">Czat</button>
      <button data-view="view-polls">Głosowania</button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
